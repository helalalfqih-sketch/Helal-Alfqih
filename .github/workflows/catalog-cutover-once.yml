name: One-time catalog Supabase cutover

on:
  push:
    branches:
      - fix/catalog-supabase-source-of-truth

permissions:
  contents: write

jobs:
  cutover:
    if: "github.event.head_commit.message == 'chore(catalog): run one-time Supabase cutover'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-supabase-source-of-truth
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Remove request-time Firebase CSV reads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/lib/catalog.functions.ts')
          s = path.read_text(encoding='utf-8')
          original = s

          s, n = re.subn(
              r'type ProductInsert = Database\["public"\]\["Tables"\]\["products"\]\["Insert"\];\n'
              r'type CsvProduct = ProductDTO & \{ category_name: string \};\n'
              r'type CsvCategory = \{.*?\n\};\n\n',
              '',
              s,
              count=1,
              flags=re.S,
          )
          assert n == 1, 'CSV type block not found exactly once'

          s, n = re.subn(
              r'// -------- CSV Feed Parser & Helpers for storefront --------.*?'
              r'// ============ PUBLIC READS ============',
              '// ============ PUBLIC READS ============',
              s,
              count=1,
              flags=re.S,
          )
          assert n == 1, 'CSV helper block not found exactly once'

          list_products = '''export const listProducts = createServerFn({ method: "GET" })
            .inputValidator((raw: unknown) =>
              z
                .object({
                  tenantId: z.string().uuid().optional(),
                  categoryId: z.string().optional(),
                  search: z.string().optional(),
                  limit: z.number().int().min(1).max(100).optional(),
                  offset: z.number().int().min(0).optional(),
                })
                .parse(raw ?? {}),
            )
            .handler(async ({ data }) => {
              const db = publicClient();
              const tenantId = await resolvePublicTenant(db, data.tenantId ?? null);
              const products = await productsRepo.list(db, {
                tenantId,
                categoryId: data.categoryId,
                search: data.search,
              });

              if (data.offset != null && data.limit) {
                return products.slice(data.offset, data.offset + data.limit);
              }
              if (data.offset != null) return products.slice(data.offset);
              if (data.limit) return products.slice(0, data.limit);
              return products;
            });

          '''
          s, n = re.subn(
              r'export const listProducts = createServerFn\(\{ method: "GET" \}\).*?'
              r'(?=export const getProductBySlug)',
              list_products,
              s,
              count=1,
              flags=re.S,
          )
          assert n == 1, 'listProducts block not found exactly once'

          get_product = '''export const getProductBySlug = createServerFn({ method: "GET" })
            .inputValidator((raw: unknown) =>
              z.object({ slug: z.string(), tenantId: z.string().uuid().optional() }).parse(raw),
            )
            .handler(async ({ data }) => {
              const db = publicClient();
              const tenantId = await resolvePublicTenant(db, data.tenantId ?? null);
              return productsRepo.getBySlug(db, data.slug, tenantId);
            });

          '''
          s, n = re.subn(
              r'export const getProductBySlug = createServerFn\(\{ method: "GET" \}\).*?'
              r'(?=/\*\*\n \* getProductsByIds)',
              get_product,
              s,
              count=1,
              flags=re.S,
          )
          assert n == 1, 'getProductBySlug block not found exactly once'

          list_categories = '''export const listCategories = createServerFn({ method: "GET" })
            .inputValidator((raw: unknown) =>
              z.object({ tenantId: z.string().uuid().optional() }).parse(raw ?? {}),
            )
            .handler(async ({ data }) => {
              const db = publicClient();
              const tenantId = await resolvePublicTenant(db, data.tenantId);
              return categoriesRepo.list(db, { tenantId, includeInactive: false });
            });

          '''
          s, n = re.subn(
              r'export const listCategories = createServerFn\(\{ method: "GET" \}\).*?'
              r'(?=export const getCategoryBySlug)',
              list_categories,
              s,
              count=1,
              flags=re.S,
          )
          assert n == 1, 'listCategories block not found exactly once'

          admin_prefix = '''    // Supabase is the operational source of truth for admin catalog reads.
              let filtered = await productsRepo.list(ctx.supabase, {
                tenantId,
                search: data.search,
                categoryId: data.categoryId,
              });

              if (data.publishedOnly)'''
          s, n = re.subn(
              r'    // ── 1\. Fetch Supabase products.*?'
              r'    if \(data\.publishedOnly\)',
              admin_prefix,
              s,
              count=1,
              flags=re.S,
          )
          assert n == 1, 'admin CSV merge block not found exactly once'

          auto_categorize = '''export const adminAutoCategorizeProducts = createServerFn({ method: "POST" })
            .middleware([requireSupabaseAuth])
            .inputValidator((raw: unknown) =>
              z.object({ tenantId: z.string().uuid().optional() }).parse(raw ?? {}),
            )
            .handler(async ({ data, context }) => {
              const ctx = context;
              await assertAdmin(ctx);
              const tenantId = await resolveAdminTenant(ctx, data.tenantId);

              let dbCategories = await categoriesRepo.list(ctx.supabase, {
                tenantId,
                includeInactive: true,
              });

              if (!dbCategories || dbCategories.length === 0) {
                const defaultCats = [
                  { name: "إلكترونيات", slug: "electronics", icon: "Smartphone", color: "purple" },
                  { name: "الجمال والعناية", slug: "beauty-care", icon: "Sparkles", color: "pink" },
                  { name: "المطبخ والأواني", slug: "kitchen", icon: "Utensils", color: "orange" },
                  { name: "التنظيم والتخزين", slug: "storage-organization", icon: "Archive", color: "yellow" },
                  { name: "الصحة والمساج", slug: "health-massage", icon: "Activity", color: "red" },
                  { name: "الرياضة واللياقة", slug: "sports-fitness", icon: "Flame", color: "emerald" },
                  { name: "السيارات والإكسسوارات", slug: "automotive", icon: "Car", color: "blue" },
                  { name: "الأطفال والألعاب", slug: "kids-toys", icon: "Baby", color: "cyan" },
                ];
                for (let i = 0; i < defaultCats.length; i++) {
                  const cat = defaultCats[i];
                  try {
                    await categoriesRepo.create(ctx.supabase, tenantId, {
                      name: cat.name,
                      slug: cat.slug,
                      icon: cat.icon,
                      color: cat.color,
                      is_active: true,
                      sort: i,
                    });
                  } catch {
                    // Category may already exist; refresh below.
                  }
                }
                dbCategories = await categoriesRepo.list(ctx.supabase, {
                  tenantId,
                  includeInactive: true,
                });
              }

              const catMap = new Map<string, string>();
              for (const category of dbCategories) {
                catMap.set(category.slug.toLowerCase(), category.id);
              }
              const defaultCatId = dbCategories[0]?.id;
              const products = await productsRepo.list(ctx.supabase, { tenantId });
              let categorizedCount = 0;

              for (const product of products) {
                const slugMatch = inferCategorySlug(
                  product.name,
                  product.tags ?? [],
                  product.description ?? "",
                );
                const categoryId = catMap.get(slugMatch) ?? defaultCatId;
                if (!categoryId || product.category_id === categoryId) continue;
                await productsRepo.update(ctx.supabase, tenantId, product.id, {
                  category_id: categoryId,
                });
                categorizedCount++;
              }

              return { total: products.length, categorizedCount };
            });

          '''
          s, n = re.subn(
              r'export const adminAutoCategorizeProducts = createServerFn\(\{ method: "POST" \}\).*?'
              r'(?=export const adminBulkAssignCategory)',
              auto_categorize,
              s,
              count=1,
              flags=re.S,
          )
          assert n == 1, 'adminAutoCategorizeProducts block not found exactly once'

          assert 'fetchCsvProducts' not in s, 'Runtime CSV fetch reference remains'
          assert 'CATALOG_IMPORT_URL' not in s, 'Runtime catalog URL reference remains'
          assert 'CsvProduct' not in s, 'CSV runtime type reference remains'
          assert s != original, 'No changes were made'
          path.write_text(s, encoding='utf-8')
          PY

      - name: Format and validate cutover
        run: |
          npx prettier --write src/lib/catalog.functions.ts
          npx prettier --check src/lib/catalog.functions.ts
          npx eslint --max-warnings=0 src/lib/catalog.functions.ts
          npm run typecheck
          npm run test:unit
          npm run test:integration
          npm run test:security
          npm run build
          git diff --check

      - name: Commit Supabase-only storefront cutover
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No diff after cutover; refusing to create empty commit.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/catalog.functions.ts
          git commit -m 'fix(catalog): make storefront reads Supabase-only'
          git push origin HEAD:fix/catalog-supabase-source-of-truth
