name: One-time catalog cutover security test update

on:
  push:
    branches:
      - fix/catalog-supabase-source-of-truth
    paths:
      - .github/workflows/catalog-cutover-test-update.yml

permissions:
  contents: write

jobs:
  update-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-supabase-source-of-truth
          fetch-depth: 0

      - name: Update security contract for Supabase-only runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/p0-security.test.ts")
          text = path.read_text(encoding="utf-8")
          old = '''    expect(catalogFunctionsFile).not.toContain("GLOBAL_CSV_URL");
              expect(catalogFunctionsFile).not.toMatch(/[?&]token=[A-Za-z0-9_-]+/);
              expect(catalogFunctionsFile).toContain("process.env.CATALOG_IMPORT_URL");
          '''
          if old not in text:
              old = '''    expect(catalogFunctionsFile).not.toContain("GLOBAL_CSV_URL");
              expect(catalogFunctionsFile).not.toMatch(/[?&]token=[A-Za-z0-9_-]+/);
              expect(catalogFunctionsFile).toContain("process.env.CATALOG_IMPORT_URL");
          '''
          # Exact source currently has four spaces; use direct replacement by assertion if block indentation differs.
          if 'expect(catalogFunctionsFile).toContain("process.env.CATALOG_IMPORT_URL");' not in text:
              raise SystemExit("Legacy CATALOG_IMPORT_URL assertion not found")
          text = text.replace(
              '    expect(catalogFunctionsFile).toContain("process.env.CATALOG_IMPORT_URL");',
              '    expect(catalogFunctionsFile).not.toContain("process.env.CATALOG_IMPORT_URL");\n'
              '    expect(catalogFunctionsFile).not.toContain("fetchCsvProducts");\n'
              '    expect(catalogFunctionsFile).not.toContain("firebasestorage.googleapis.com");',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - run: npx prettier --write tests/unit/p0-security.test.ts

      - name: Commit test contract update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/p0-security.test.ts
          git commit -m "test(catalog): enforce Supabase-only storefront reads"
          git push origin HEAD:fix/catalog-supabase-source-of-truth
