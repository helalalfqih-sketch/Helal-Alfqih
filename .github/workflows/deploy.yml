name: Production Migration Workflow

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: 'Type "CONFIRM_PRODUCTION_MIGRATION" to execute database push'
        required: true
        type: string

jobs:
  migrate-production:
    name: Apply Production Supabase Migrations (Manual Approval Required)
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Verify Explicit Confirmation Input
        run: |
          if [ "${{ github.event.inputs.confirm_deployment }}" != "CONFIRM_PRODUCTION_MIGRATION" ]; then
            echo "ERROR: Confirmation input mismatch. Got '${{ github.event.inputs.confirm_deployment }}'"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase DB Push
        run: supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
